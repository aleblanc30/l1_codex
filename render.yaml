# Render blueprint: a free web service that sleeps when idle and wakes on the next request.
services:
  - type: web
    name: codex-l1
    runtime: docker
    plan: free
    healthCheckPath: /
    # No environment variables are required. FLASK_SECRET_KEY is optional (the app uses no sessions).
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
